<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cek Transaksi — Nadzz Joki</title>
    <meta name="description" content="Lacak status dan progres pesanan joki dengan kode pesanan.">
    <meta name="theme-color" content="#02040a">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icons/nadzzjoki.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Manrope:wght@400;500;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind.config.js"></script>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/fx.css">
</head>

<body class="min-h-screen">
    <div id="site-header"></div>
    <main class="mx-auto max-w-3xl px-5 py-10">
        <h1 class="text-3xl font-bold mb-2">Cek <span class="grad-text">transaksi</span></h1>
        <p class="text-slate-400 mb-6">Masukkan kode pesanan (contoh NJ2610...) untuk melihat status dan progres
            terkini.</p>
        <form id="f" class="glass rounded-2xl p-4 flex flex-col sm:flex-row gap-3"><input id="c" class="field"
                placeholder="Kode pesanan" required autocomplete="off"><button
                class="btn-grad rounded-xl px-7 py-2.5">Lacak</button></form>
        <p id="err" class="text-sm text-red-400 mt-4 hidden"></p>
        <div id="res" class="mt-6"></div>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="/js/pages/track.js"></script>
</body>

</html>
